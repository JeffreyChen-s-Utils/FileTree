name: Tests

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    name: macOS arm64 / Python 3.12
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python 3.12
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: python -m pip install -r dev_requirements.txt
    - name: Run tests
      env:
        QT_QPA_PLATFORM: offscreen
        PYTHONFAULTHANDLER: "1"
      run: python -m pytest -v --tb=short -p no:unraisableexception
    - name: Validate owned native metadata and cocoa rendering
      run: python tools/validate_macos_sources.py --evidence macos-evidence
    - name: Preserve macOS evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: macos-native-sources
        path: macos-evidence/
        if-no-files-found: warn
        retention-days: 7
  windows-volume:
    runs-on: windows-latest
    name: Windows private NTFS volume
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python 3.12
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: python -m pip install -r dev_requirements.txt
    - name: Validate fresh owned VHDX, private NTFS bin and detached compaction
      env:
        QT_QPA_PLATFORM: offscreen
      run: python tools/validate_windows_volume.py --output windows-volume.json
    - name: Validate fresh owned VHD, private NTFS bin and detached compaction
      env:
        QT_QPA_PLATFORM: offscreen
      run: python tools/validate_windows_volume.py --kind vhd --output windows-volume-vhd.json
    - name: Preserve private volume evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: windows-private-volume
        path: |
          windows-volume.json
          windows-volume-vhd.json
        if-no-files-found: warn
        retention-days: 7
    - name: Compare sparse Trash lengths on a fresh owned larger NTFS volume
      env:
        QT_QPA_PLATFORM: offscreen
      run: python tools/validate_windows_sparse_trash.py --output windows-sparse-trash-2gib.json
    - name: Preserve sparse Trash size-boundary evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: windows-sparse-trash-2gib
        path: windows-sparse-trash-2gib.json
        if-no-files-found: warn
        retention-days: 7
  linux-restore:
    runs-on: ubuntu-latest
    name: Linux native Trash restore
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python 3.12
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.12"
    - name: Validate fresh owned restore fixtures
      run: python tools/validate_linux_restore.py --output linux-restore.json
    - name: Preserve restore evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: linux-native-restore
        path: linux-restore.json
        if-no-files-found: warn
        retention-days: 7
  linux-desktop:
    runs-on: ubuntu-latest
    name: Linux desktop / X11 and D-Bus
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Build isolated desktop probe
      run: docker build --build-arg DESKTOP_UID="$(id -u)" --build-arg DESKTOP_GID="$(id -g)" -t filetree-desktop-probe -f tools/linux_desktop/Dockerfile .
    - name: Test native desktop behavior
      shell: bash
      run: |
        mkdir -p desktop-evidence
        docker run --rm --user "$(id -u):$(id -g)" --memory=1g --cpus=2 -v "$PWD:/workspace:ro" -v "$PWD/desktop-evidence:/evidence" filetree-desktop-probe 2>&1 | tee desktop-evidence/probe.log
    - name: Preserve desktop evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: linux-desktop-evidence
        path: desktop-evidence/
        if-no-files-found: warn
        retention-days: 7
  lint:
    runs-on: ubuntu-latest
    name: Lint (ruff)
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python 3.12
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.12"
    - name: Install ruff
      # Same pin as dev_requirements.txt.
      run: python -m pip install "ruff==0.15.14"
    - name: ruff
      run: python -m ruff check . --output-format=github

  windows:
    runs-on: windows-latest
    name: Windows / Python ${{ matrix.python-version }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: python -m pip install -r dev_requirements.txt
    - name: Run tests
      env:
        QT_QPA_PLATFORM: offscreen
        PYTHONFAULTHANDLER: "1"
      run: python -m pytest -v --tb=short -p no:unraisableexception

    - name: Validate compression on fresh owned NTFS fixtures
      run: python tools/validate_windows_compression.py --output windows-compression.json
    - name: Validate fresh owned native change feed
      run: python tools/validate_change_watch.py --output change-watch.json
    - name: Preserve native change-feed evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: windows-change-watch-${{ matrix.python-version }}
        path: change-watch.json
        if-no-files-found: warn
        retention-days: 7
    - name: Preserve compression evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: windows-compression-${{ matrix.python-version }}
        path: windows-compression.json
        if-no-files-found: warn
        retention-days: 7

  linux:
    runs-on: ubuntu-latest
    name: Linux / Python 3.12
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python 3.12
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.12"
    - name: Install Qt's system libraries
      run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
    - name: Install dependencies
      run: python -m pip install -r dev_requirements.txt
    - name: Run tests
      # Linux is where the symlink test runs (Windows needs extra rights to make one).
      env:
        QT_QPA_PLATFORM: offscreen
        PYTHONFAULTHANDLER: "1"
      run: python -m pytest -v --tb=short -p no:unraisableexception
    - name: Validate isolated ext4 capacity and recovery
      run: python tools/validate_linux_volume.py --evidence volume-evidence
    - name: Validate fresh owned native changes and external hard-link aliases
      run: python tools/validate_change_watch.py --output change-watch.json
    - name: Preserve native change-feed evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: linux-change-watch
        path: change-watch.json
        if-no-files-found: warn
        retention-days: 7
    - name: Preserve volume evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: linux-volume-evidence
        path: volume-evidence/
        if-no-files-found: warn
        retention-days: 7
