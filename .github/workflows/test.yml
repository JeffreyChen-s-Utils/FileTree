name: Tests

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint (ruff)
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python 3.12
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.12"
    - name: Install ruff
      # Same pin as dev_requirements.txt.
      run: python -m pip install "ruff==0.15.14"
    - name: ruff
      run: python -m ruff check . --output-format=github

  windows:
    runs-on: windows-latest
    name: Windows / Python ${{ matrix.python-version }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: python -m pip install -r dev_requirements.txt
    - name: Run tests
      env:
        QT_QPA_PLATFORM: offscreen
        PYTHONFAULTHANDLER: "1"
      run: python -m pytest -v --tb=short -p no:unraisableexception

  linux:
    runs-on: ubuntu-latest
    name: Linux / Python 3.12
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python 3.12
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.12"
    - name: Install Qt's system libraries
      run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
    - name: Install dependencies
      run: python -m pip install -r dev_requirements.txt
    - name: Run tests
      # Linux is where the symlink test runs (Windows needs extra rights to make one).
      env:
        QT_QPA_PLATFORM: offscreen
        PYTHONFAULTHANDLER: "1"
      run: python -m pytest -v --tb=short -p no:unraisableexception
