name: POSIX desktop builds

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install native compiler and Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential patchelf libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1 libdbus-1-3 libglib2.0-0 desktop-file-utils
      - name: Install shared pinned compiler tools
        run: python tools/install_compiler.py
      - name: Compile the complete Linux runtime
        run: python tools/build_nuitka.py
      - name: Package and extract-check the actual x86_64 AppImage
        run: |
          version=$(python -c "from je_file_tree import __version__; print(__version__)")
          mapfile -t folders < <(find build/standalone -maxdepth 1 -type d -name '*.dist')
          test "${#folders[@]}" -eq 1
          python tools/package_posix.py --platform linux --source "${folders[0]}" --version "$version"
      - name: Retain the AppImage and source/extraction proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: linux-compiled
          path: desktop-package/
          if-no-files-found: warn
          retention-days: 7
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install shared pinned compiler tools
        run: python tools/install_compiler.py
      - name: Compile the actual macOS app bundle
        run: python tools/build_nuitka.py --app
      - name: Package and extract-check the complete app bundle
        run: |
          version=$(python -c "from je_file_tree import __version__; print(__version__)")
          python tools/package_posix.py --platform macos --source build/app/start_file_tree.app --version "$version"
      - name: Retain the app bundle archive and source/extraction proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: macos-compiled
          path: desktop-package/
          if-no-files-found: warn
          retention-days: 7
