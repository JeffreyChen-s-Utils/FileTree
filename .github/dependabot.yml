version: 2
updates:
  # Development work, dependency bumps included, goes to dev; main takes
  # releases only.
  - package-ecosystem: "pip"
    # The project's own manifests at the root, and the hash-locked tools the
    # release job installs (publish.txt): from the root Dependabot does not look
    # as deep as .github/requirements, so the directory is named.
    directories:
      - "/"
      - "/.github/requirements"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    cooldown:
      default-days: 7
  # Workflow actions are pinned to commit SHAs with the version as a comment
  # (test/test_workflow_actions.py); Dependabot moves both together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    cooldown:
      default-days: 7
